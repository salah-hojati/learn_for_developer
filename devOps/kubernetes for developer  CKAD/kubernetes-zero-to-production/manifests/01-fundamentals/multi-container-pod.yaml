# Module: 01 Fundamentals | Lesson: 01
# A multi-container Pod with a sidecar sharing a volume.
apiVersion: v1
kind: Pod
metadata:
  name: app-with-sidecar
  labels:
    app: app-with-sidecar
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "while true; do echo $(date -Iseconds) $(hostname) >> /shared/app.log; sleep 5; done"]
    volumeMounts:
    - name: shared
      mountPath: /shared
  - name: sidecar
    image: busybox:1.36
    command: ["sh", "-c", "tail -n 10 -f /shared/app.log"]
    volumeMounts:
    - name: shared
      mountPath: /shared
  volumes:
  - name: shared
    emptyDir: {}
