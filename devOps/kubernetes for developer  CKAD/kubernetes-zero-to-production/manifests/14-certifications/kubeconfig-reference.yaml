# Module: 14 Certifications | Lesson: 44
# A kubeconfig with a service-account-derived user and an admin context for CKA exam setup.
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: cka-admin-token
  namespace: default
  annotations:
    kubernetes.io/service-account.name: "cka-admin"
# Note: prefer TokenRequest API for modern clusters; shown here is the legacy form.
---
# Minimal kubeconfig fragment (not a resource) kept for reference:
