# Module: 10 GitOps | Lesson: 31
# An Argo CD Application that syncs the production path of a Git repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-app
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/SuchanMadhikarmi/kubernetes-zero-to-production.git
    targetRevision: main
    path: manifests/04-networking
  destination:
    server: https://kubernetes.default.svc
    namespace: web
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true