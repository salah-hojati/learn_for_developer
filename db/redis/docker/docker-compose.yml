version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis-server
    restart: "no"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --requirepass YourStrongPassword123
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "YourStrongPassword123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data: